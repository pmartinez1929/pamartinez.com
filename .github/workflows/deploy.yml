name: Build y deploy

on:
  push:
    branches: [main]
  # Cada PR hacia main compila y ejecuta los tests (check requerido para el merge); nunca despliega
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Los deploys de main van en serie; cada PR tiene su propio grupo y un push nuevo cancela el run anterior
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Compila y valida (astro build + tests sobre dist/)
      - run: npm test

      # Los secrets solo se exponen a este paso y al de deploy (no a npm ci / npm test), y solo en main
      - name: Verificar configuración de deploy
        id: ftp
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_DIR" ] && [[ "$FTP_DIR" == */ ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy por FTP
        if: ${{ github.ref == 'refs/heads/main' && steps.ftp.outputs.enabled == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/

      - name: Deploy omitido
        if: ${{ !(github.ref == 'refs/heads/main' && steps.ftp.outputs.enabled == 'true') }}
        run: |
          echo "::notice::Se compiló y validó, pero no se desplegó: la rama no es main, falta algún secret FTP (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR) o FTP_DIR sin / al final."
